    <script>
        (function() {
            try {
                var p = (window.location.pathname || '').toLowerCase();
                var s = window.location.search || '';
                var h = (window.location.hash || '').toLowerCase();
                
                if (p.endsWith('/index.html')) {
                    p = p.replace(/\/index\.html$/, '') || '/';
                }

                var params = new URLSearchParams(s);
                var code = params.get('code') || params.get('pin');
                
                // Normalizing recipe intent from path, hash or query params
                var isRecipes = p.includes('recipe') || 
                                p.includes('מתכונ') || 
                                p.includes('cookbook') || 
                                p.includes('matkonim') || 
                                h.includes('recipe') || 
                                h.includes('מתכונ') || 
                                h.includes('cookbook') || 
                                h.includes('matkonim') || 
                                params.has('recipes') || 
                                params.has('recipe') || 
                                params.get('page') === 'recipes' || 
                                params.get('p') === 'recipes';

                // If visiting recipes in any form, route directly to #/recipes
                if (isRecipes) {
                    if (window.location.hash !== '#/recipes' || (window.location.pathname !== '/' && window.location.pathname !== '')) {
                        window.location.replace('/#/recipes' + (s ? s : ''));
                        return;
                    }
                }

                // If visiting responses or inquiries path/query
                var isResponses = p.includes('responses') || p.includes('inquiries') || h.includes('responses') || h.includes('inquiries') || params.has('responses') || params.has('inquiries');
                if (isResponses) {
                    var targetCode = code ? ('?code=' + code) : '?code=9672';
                    if (!window.location.hash.startsWith('#/responses')) {
                        window.location.replace('/#/responses' + targetCode);
                        return;
                    }
                }

                // If user arrived with code=9672 on homepage, automatically route to /responses
                if (code === '9672' && (!h || h === '#/' || h === '#')) {
                    window.location.replace('/#/responses?code=9672');
                    return;
                }

                // Fix any hash missing a leading slash (e.g., #recipes -> #/recipes, #programs -> #/programs)
                if (h && h.startsWith('#') && !h.startsWith('#/')) {
                    var cleanHash = '#/' + h.slice(1);
                    window.location.replace(cleanHash + s);
                    return;
                }

                // Standard pathname to hash rewrite for SPA navigation
                if (p && p !== '/' && !h) {
                    var cleanP = p.startsWith('/') ? p : ('/' + p);
                    cleanP = cleanP.replace(/\/+$/, '') || '/';
                    window.location.replace('/#' + cleanP + s);
                    return;
                }
            } catch (err) {
                console.warn('Navigation redirect error:', err);
            }
        })();
    </script>

        .bg-pattern { background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4z' fill='%2354634f' fill-opacity='0.02'/%3E%3C/svg%3E"); }
        
        @keyframes float { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-15px) rotate(5deg); } }
        .animate-float { animation: float 6s ease-in-out infinite; }
        
        @keyframes drift {
            0% { transform: translate(0,0) rotate(0deg); }
            50% { transform: translate(15px, -10px) rotate(10deg); }
            100% { transform: translate(0,0) rotate(0deg); }
        }
        .animate-drift { animation: drift 8s ease-in-out infinite; }

        @keyframes pulse-ring { 0% { transform: scale(.33); } 80%, 100% { opacity: 0; } }
        .animate-pulse-ring { animation: pulse-ring 1.25s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }

        @keyframes badge-blink {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.6);
            }
            50% {
                opacity: 0.75;
                transform: scale(1.04);
                box-shadow: 0 0 0 6px rgba(79, 70, 229, 0);
            }
        }
        .animate-badge-blink {
