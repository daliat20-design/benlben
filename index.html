<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>ספר המתכונים של בין לבין</title>
    
    <meta property="og:title" content="ספר המתכונים של בין לבין" />
    <meta property="og:description" content="ספר מתכונים דיגיטלי מעוצב - השראה למטבח בריא ומזין באמצע החיים מבית 'בין לבין'." />
    <meta property="og:image" content="https://i.postimg.cc/zXNcsDYk/header-jpg.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="theme-color" content="#54634f">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Heebo', 'sans-serif'] },
                    colors: {
                        brand: {
                            green: '#54634f',
                            lightGreen: '#8a9a83',
                            orange: '#d98c45',
                            beige: '#f1f2e9',
                            cream: '#faf9f6'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Heebo', sans-serif; scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(84,99,79,0.1); }
        .bg-pattern { background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4z' fill='%2354634f' fill-opacity='0.02'/%3E%3C/svg%3E"); }
        
        @keyframes float { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-15px) rotate(5deg); } }
        .animate-float { animation: float 6s ease-in-out infinite; }
        
        @keyframes drift {
            0% { transform: translate(0,0) rotate(0deg); }
            50% { transform: translate(15px, -10px) rotate(10deg); }
            100% { transform: translate(0,0) rotate(0deg); }
        }
        .animate-drift { animation: drift 8s ease-in-out infinite; }

        @keyframes pulse-ring { 0% { transform: scale(.33); } 80%, 100% { opacity: 0; } }
        .animate-pulse-ring { animation: pulse-ring 1.25s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
    </style>
</head>
<body class="bg-brand-cream text-gray-800 bg-pattern">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
